<!-- STARTER SCENE (cards): tilted example cards fly in from different edges (backOut, speed blur, gentle float) around a
     centred phrase, then gather into one board as it rises in ("susun"). One card per spoken item. Label staged material CONTOH. -->
<section class="scene" id="cards">
  <div class="cam" id="cards-cam"><div class="step" id="cards-step">
    <div class="hl" id="cards-h1" data-y="960" data-size="88" data-out="cards:-3@-0.15">
      <span data-at="cards:0">Rancang</span><span class="blue" data-at="cards:1">scene</span><span data-at="cards:2">dulu.</span>
    </div>
    <!-- each card: .gat (gather point = card centre) > .fly (entrance) > .flt (float) > card -->
    <div class="gat" id="cards-g1" style="position: absolute; left: 300px; top: 520px; width: 1px; height: 1px">
      <div class="fly" id="cards-f1" data-layout-allow-overlap style="position: absolute; left: 0; top: 0; width: 400px; opacity: 0"><div class="flt">
        <div style="background: #fff; border-radius: 30px; overflow: hidden; box-shadow: var(--deep)">
          <div style="position: relative"><div class="ph" style="height: 300px; border-radius: 0; font-size: 30px">Aset contoh</div>
            <div style="position: absolute; left: 16px; top: 16px"><span class="chip ink" style="font-size: 22px">CONTOH</span></div></div>
          <div style="padding: 20px 24px 24px; font-weight: 600; font-size: 34px; letter-spacing: -0.02em">Produk</div>
        </div>
      </div></div>
    </div>
    <div class="gat" id="cards-g2" style="position: absolute; left: 790px; top: 560px; width: 1px; height: 1px">
      <div class="fly" id="cards-f2" data-layout-allow-overlap style="position: absolute; left: 0; top: 0; width: 400px; opacity: 0"><div class="flt">
        <div style="background: #fff; border-radius: 30px; overflow: hidden; box-shadow: var(--deep)">
          <div style="position: relative"><div class="ph" style="height: 300px; border-radius: 0; font-size: 30px">Aset contoh</div>
            <div style="position: absolute; left: 16px; top: 16px"><span class="chip ink" style="font-size: 22px">CONTOH</span></div></div>
          <div style="padding: 20px 24px 24px; font-weight: 600; font-size: 34px; letter-spacing: -0.02em">Orang</div>
        </div>
      </div></div>
    </div>
    <div class="gat" id="cards-g3" style="position: absolute; left: 540px; top: 1420px; width: 1px; height: 1px">
      <div class="fly" id="cards-f3" data-layout-allow-overlap style="position: absolute; left: 0; top: 0; width: 400px; opacity: 0"><div class="flt">
        <div style="background: #fff; border-radius: 30px; overflow: hidden; box-shadow: var(--deep)">
          <div style="position: relative"><div class="ph" style="height: 300px; border-radius: 0; font-size: 30px">Aset contoh</div>
            <div style="position: absolute; left: 16px; top: 16px"><span class="chip ink" style="font-size: 22px">CONTOH</span></div></div>
          <div style="padding: 20px 24px 24px; font-weight: 600; font-size: 34px; letter-spacing: -0.02em">Dialog</div>
        </div>
      </div></div>
    </div>
    <div id="cards-board" style="position: absolute; left: 210px; top: 560px; width: 660px; opacity: 0">
      <div style="border-radius: 26px; overflow: hidden; box-shadow: var(--deep)"><div class="ph dark" style="height: 1000px; border-radius: 0; font-size: 40px">Storyboard (gantikan)</div></div>
    </div>
  </div></div>
</section>
<script>
scene("cards", (S) => {
  const gAt = sw("cards", -3, -0.1);
  cam(S, { steps: [sw("cards", 3, -0.05), sw("cards", 5, -0.05)], push: 0.02, roll: 0.7 });
  headline("cards-h1");
  // [id, word, final centre, entry offset from it, tilt, gather target]
  const cards = [
    ["1", 3, [300, 520], [-720, -140], -7, [400, 900]],
    ["2", 4, [790, 560], [710, -140], 6, [680, 900]],
    ["3", 5, [540, 1420], [0, 880], -3, [540, 1200]],
  ];
  cards.forEach(([n, w, pos, from, rot, to], i) => {
    flyIn($("cards-f" + n), sw("cards", w, -0.12), { from, rot, floatEnd: S.end, phase: pos[0] });
    const g = $("cards-g" + n);
    tl.fromTo(g, { x: 0, y: 0, scale: 1, rotation: 0 }, { x: to[0] - pos[0], y: to[1] - pos[1], scale: 0.5, rotation: -rot, duration: 0.5, ease: EASE_IO }, gAt);
    curve(g, "opacity", gAt, 0.5, (p) => 1 - clamp01((EASE_IO(p) - 0.55) / 0.45), { ir: true });
  });
  // board rises in as the cards gather
  const bAt = gAt + 0.15;
  tl.fromTo("#cards-board", { y: 220 }, { y: 0, duration: 0.5, ease: EASE_OUT }, bAt);
  tl.fromTo("#cards-board", { scale: 0.86 }, { scale: 1, duration: 0.5, ease: (p) => backOut(EASE_OUT(p)) }, bAt);
  curve("#cards-board", "opacity", bAt, 0.5, (p) => Math.min(1, EASE_OUT(p) * 1.6));
  tl.fromTo("#cards-board", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.5, ease: EASE_OUT }, bAt);
  tl.set("#cards-board", { filter: "none" }, bAt + 0.51);
});
</script>
