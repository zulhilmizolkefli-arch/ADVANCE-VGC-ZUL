<!-- STARTER SCENE (cta): a four-point sparkle flies a curve with a soft trail and lands on the logo's top-right, logo ->
     tagline (user's words) -> gradient button (user's exact label) -> cursor tap on "klik" -> calm hold (plan.end_hold, 3.5 s)
     with a slow 1 -> 1.02 push. Replace the "Brand" text with the student's own logo: <img src="assets/img/logo.png" style="height:150px">.
     No URL text unless the user asks for it. -->
<section class="scene" id="cta">
  <div class="cam" id="cta-cam"><div class="step" id="cta-step"><div class="layer" id="cta-hold">
    <div class="fx" id="cta-trail"></div>
    <div class="spark" id="cta-spark"><div class="layer tf"><div class="layer tw">
      <svg viewBox="-50 -50 100 100"><defs><linearGradient id="cta-spk" x1="0" y1="-1" x2="1" y2="1"><stop offset="0" stop-color="#7CC0F9" /><stop offset="1" stop-color="#2B7CF5" /></linearGradient></defs>
        <path d="M0 -50 C6 -12 12 -6 50 0 C12 6 6 12 0 50 C-6 12 -12 6 -50 0 C-12 -6 -6 -12 0 -50Z" fill="url(#cta-spk)" style="filter: drop-shadow(0 0 8px rgba(72,152,248,0.55))" /></svg>
    </div></div></div>
    <div id="cta-logo" style="position: absolute; left: 0; top: 620px; width: 1080px; display: flex; justify-content: center; opacity: 0">
      <div id="cta-logo-in" class="grad-text" style="font-weight: 700; font-size: 120px; letter-spacing: -0.04em; line-height: 1.2">Brand</div>
    </div>
    <div class="hl" id="cta-h1" data-y="1010" data-size="64" data-max="860">
      <span data-at="cta:2">Belajar</span><span class="blue" data-at="cta:3">satu-satu,</span><span data-at="cta:4">ikut</span><span data-at="cta:5">step.</span>
    </div>
    <div id="cta-btn" style="position: absolute; left: 170px; top: 1150px; width: 740px; height: 136px; opacity: 0">
      <div class="btn" id="cta-btn-in" style="left: 0; top: 0">Label Button<div class="ripple" id="cta-ripple"></div></div>
    </div>
    <div class="cursor" id="cta-cursor">
      <svg width="86" height="96" viewBox="0 0 43 48"><path d="M14 3.5c0-1.9 1.5-3.5 3.4-3.5s3.4 1.6 3.4 3.5v14.2l1.2-.2c1.8-.3 3.5.7 4.1 2.3 1.5-.6 3.3 0 4.2 1.5 1.5-.5 3.2.1 4 1.5l.7 1.2c.9 1.6 1.4 3.4 1.4 5.3v6.1C36.4 42.3 30.7 48 23.8 48h-2.3c-4.1 0-7.9-2-10.2-5.4L3.7 31.4c-1.1-1.6-.8-3.8.8-5 1.5-1.1 3.6-1 4.9.3l4.6 4.5V3.5Z" fill="#fff" stroke="#24243A" stroke-width="2" stroke-linejoin="round" /></svg>
    </div>
  </div></div></div>
</section>
<script>
scene("cta", (S) => {
  const a = S.a, LOGO_Y = 690, logoAt = sw("cta", 1, -0.1), btnAt = sw("cta", -5, -0.1), tapAt = sw("cta", -2, 0.12);
  cam(S, { steps: [logoAt], push: 0.02, roll: 0.3 });
  sparkleFlight("cta-spark", "cta-trail", a, [[150, 1560], [120, 820], [980, 1040], [860, LOGO_Y - 90]]);
  tl.fromTo("#cta-logo", { opacity: 0, scale: 0.8, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: (p) => backOut(EASE_OUT(p)) }, logoAt);
  tl.set("#cta-logo", { filter: "none" }, logoAt + 0.46);
  float("#cta-logo-in", "y", a, TOTAL, 6, 1.2);
  headline("cta-h1");
  tl.fromTo("#cta-btn", { opacity: 0, scale: 0.8, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: (p) => backOut(EASE_OUT(p)) }, btnAt);
  tl.set("#cta-btn", { filter: "none" }, btnAt + 0.41);
  tap("cta-cursor", [900, 1600], [600, 1220], sw("cta", -2, -0.3), tapAt, sw("cta", -1, 0.6), "cta-ripple");
  tl.fromTo("#cta-btn-in", { scale: 1 }, { scale: 0.95, duration: 0.08, ease: EASE_OUT }, tapAt);
  tl.fromTo("#cta-btn-in", { scale: 0.95 }, { scale: 1, duration: 0.18, ease: EASE_OUT, immediateRender: false }, tapAt + 0.1);
  const holdAt = sw("cta", -1, 0.2);
  tl.fromTo("#cta-hold", { scale: 1 }, { scale: 1.02, duration: Math.max(0.1, TOTAL - holdAt), ease: EASE_IO }, holdAt);
});
</script>
