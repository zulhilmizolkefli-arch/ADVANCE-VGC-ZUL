    <style>
      :root {
        --bg: #faf6fe;
        --ink: #24243a;
        --ink-soft: #5b5b72;
        --blue-deep: #2b7cf5;
        --blue: #4898f8;
        --blue-light: #7cc0f9;
        --royal: #0048e0;
        --cyan: #00a9eb;
        --indigo: #4858f8;
        --line: rgba(36, 36, 58, 0.08);
        --grad: linear-gradient(90deg, #2b7cf5 0%, #4898f8 55%, #7cc0f9 100%);
        --soft: 0 30px 80px rgba(46, 72, 140, 0.16), 0 8px 24px rgba(46, 72, 140, 0.1);
        --deep: 0 60px 140px rgba(40, 60, 120, 0.24), 0 18px 40px rgba(40, 60, 120, 0.14);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; color: var(--ink); }
      #bg { position: absolute; inset: 0; overflow: hidden; }
      .glow { position: absolute; border-radius: 50%; }
      #glow1 { width: 1400px; height: 1400px; left: -520px; top: -560px; background: radial-gradient(circle, rgba(124, 192, 249, 0.16) 0%, rgba(124, 192, 249, 0) 62%); }
      #glow2 { width: 1500px; height: 1500px; right: -640px; bottom: -620px; background: radial-gradient(circle, rgba(183, 166, 248, 0.12) 0%, rgba(183, 166, 248, 0) 62%); }
      #stage { position: absolute; inset: 0; overflow: hidden; }
      .scene { position: absolute; inset: 0; opacity: 0; }
      .cam, .step, .layer { position: absolute; inset: 0; }

      /* headline (built by headline() in lib.js) */
      .hl { position: absolute; left: 0; width: 1080px; letter-spacing: -0.025em; }
      .hl-line { display: flex; justify-content: center; white-space: nowrap; }
      .hl-w { display: grid; grid-template-columns: 0fr; flex: none; }
      .hl-wi { min-width: 0; }
      .hl-g { display: inline-block; color: var(--ink); transform-origin: 50% 60%; opacity: 0; }
      .hl-g.blue { background-image: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .hl-g.royal { background-image: linear-gradient(90deg, #0048e0, #2b7cf5); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .grad-text { background-image: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

      /* surfaces */
      .card { position: absolute; background: #fff; border-radius: 34px; box-shadow: var(--soft); overflow: hidden; }
      .card.deep { box-shadow: var(--deep); }
      .chip { display: inline-flex; align-items: center; gap: 10px; font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.01em;
        padding: 0.36em 0.7em; border-radius: 999px; background: rgba(72, 152, 248, 0.12); color: var(--blue-deep); white-space: nowrap; line-height: 1.2; }
      .chip.ink { background: var(--ink); color: #fff; }
      .chip.white { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: var(--soft); }
      .ph { display: grid; place-items: center; text-align: center; border-radius: 24px; padding: 20px; font-weight: 600; color: var(--blue-deep);
        background: linear-gradient(160deg, #e6eeff, #f6f0ff); }
      .ph.dark { background: linear-gradient(160deg, #0b1a2b, #132c47); color: #9ec8ff; }

      /* phone mockup: --pw = width; height 2.13w, radius 0.14w, bezel 0.028w */
      .phone { position: absolute; left: 0; top: 0; width: var(--pw); height: calc(var(--pw) * 2.13); border-radius: calc(var(--pw) * 0.14);
        background: linear-gradient(145deg, #2a2d36, #0d0f14 40%, #1b1e26);
        box-shadow: 0 80px 160px rgba(40, 60, 120, 0.28), 0 24px 50px rgba(40, 60, 120, 0.18), inset 0 0 0 2px rgba(255, 255, 255, 0.08); }
      .phone > .scr { position: absolute; inset: calc(var(--pw) * 0.028); border-radius: calc(var(--pw) * 0.115); overflow: hidden; background: #fff; }
      .phone > .scr > .island { position: absolute; z-index: 5; top: calc(var(--pw) * 0.03); left: calc(var(--pw) * 0.332); width: calc(var(--pw) * 0.28);
        height: calc(var(--pw) * 0.075); border-radius: 999px; background: #07080b; }

      /* highlight, cursor, button, sparkle */
      .hlt { position: absolute; pointer-events: none; }
      .hlt-lab { position: absolute; left: 0; width: 100%; display: flex; justify-content: center; opacity: 0; }
      .cursor { position: absolute; left: 0; top: 0; width: 86px; height: 96px; opacity: 0; filter: drop-shadow(0 10px 18px rgba(30, 40, 80, 0.28)); }
      .btn { position: absolute; width: 740px; height: 136px; border-radius: 68px; background: var(--grad); color: #fff; font-weight: 700; font-size: 50px;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 26px 60px rgba(43, 124, 245, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35); overflow: hidden; }
      .ripple { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%, -50%);
        border: 6px solid rgba(255, 255, 255, 0.8); opacity: 0; }
      .spark { position: absolute; left: 0; top: 0; width: 70px; height: 70px; opacity: 0; }
      .spark svg { width: 100%; height: 100%; overflow: visible; }
      .trail-dot { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 9px; background: var(--blue-light); filter: blur(6px); opacity: 0; }
      .fx { position: absolute; inset: 0; pointer-events: none; }
    </style>
