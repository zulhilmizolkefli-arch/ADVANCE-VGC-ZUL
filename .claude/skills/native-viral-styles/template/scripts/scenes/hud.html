<!doctype html><html><head><meta charset="UTF-8" /></head><body><template>
<style>
/*COMMON*/
.br{position:absolute;width:110px;height:110px;border-color:#F5F7FA;border-style:solid;border-width:0;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
#tl{border-top-width:7px;border-left-width:7px;border-top-left-radius:18px}
#tr{border-top-width:7px;border-right-width:7px;border-top-right-radius:18px}
#bl{border-bottom-width:7px;border-left-width:7px;border-bottom-left-radius:18px}
#bk{border-bottom-width:7px;border-right-width:7px;border-bottom-right-radius:18px}
#ro{position:absolute;left:84px;top:1150px;padding:14px 26px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:40px;color:#F5F7FA}
#ro b{color:#FFE600}
#xh{position:absolute;left:418px;top:498px;width:44px;height:44px}
</style>
<div id="root" data-composition-id="hud" data-width="1080" data-height="1920">
  <div class="br" id="tl"></div><div class="br" id="tr"></div><div class="br" id="bl"></div><div class="br" id="bk"></div>
  <svg id="xh" viewBox="0 0 44 44"><path d="M22 4v12M22 28v12M4 22h12M28 22h12" stroke="#F5F7FA" stroke-width="4" stroke-linecap="round"/></svg>
  <div id="ro" class="glass">ZOOM <b id="zv">1.0×</b></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
// local 0 = 3.8 s
const R0={l:70,t:470,r:1010,b:1300},R1={l:190,t:440,r:690,b:960};
const place=(R,t,d,ease)=>{
  tl.to("#tl",{x:R.l,y:R.t,duration:d,ease},t);tl.to("#tr",{x:R.r-110,y:R.t,duration:d,ease},t);
  tl.to("#bl",{x:R.l,y:R.b-110,duration:d,ease},t);tl.to("#bk",{x:R.r-110,y:R.b-110,duration:d,ease},t);
};
gsap.set("#tl",{x:R0.l,y:R0.t});gsap.set("#tr",{x:R0.r-110,y:R0.t});gsap.set("#bl",{x:R0.l,y:R0.b-110});gsap.set("#bk",{x:R0.r-110,y:R0.b-110});
tl.fromTo([".br","#xh","#ro"],{opacity:0,scale:1.15},{opacity:1,scale:1,duration:.3,ease:"expo.out",stagger:.03},.05);
place(R1,.3,.48,"power3.inOut");
const vals=["1.1×","1.2×","1.3×","1.4×","1.5×","1.6×"];
vals.forEach((v,i)=>tl.set("#zv",{textContent:v},.34+i*.075));
place(R0,2.32,.5,"expo.inOut");
["1.5×","1.4×","1.3×","1.2×","1.1×","1.0×"].forEach((v,i)=>tl.set("#zv",{textContent:v},2.36+i*.07));
tl.to([".br","#xh","#ro"],{opacity:0,duration:.3,ease:"power2.in"},3.3);
window.__timelines["hud"]=tl;
</script>
</template></body></html>
