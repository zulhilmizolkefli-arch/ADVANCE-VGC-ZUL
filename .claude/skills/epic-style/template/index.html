    <style>
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/fonts/Poppins-800.woff2") format("woff2"); }
      @font-face { font-family: "Sacramento"; font-weight: 400; src: url("assets/fonts/Sacramento-400.woff2") format("woff2"); }
      @font-face { font-family: "NSD"; font-weight: 100 900; font-stretch: 62.5% 100%; src: url("assets/fonts/NotoSerifDisplay-800-62_5.woff2") format("woff2"); }

      /* Swiss act: red + white. brand act (from "the brand's team"): purple + lilac. */
      :root { --royal: #fada5e; --deep: #1d0050; --red: #b3121e; --swiss: #e3242b; --ink: #1b232b; --ap: #240064; --ap2: #352540; --lilac: #bba9ce; --mist: #e8e3ed; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1a24; }
      #root { position: absolute; inset: 0; overflow: hidden; background: #0e1a24; font-family: Poppins, sans-serif; }
      .abs { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      /* ---------- backgrounds (real places) ---------- */
      #broll { z-index: 10; }
      .bk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; visibility: hidden; background: #0e1a24; }
      .bk .kb { position: absolute; left: -54px; top: -96px; width: 1188px; height: 2112px; will-change: transform; }
      .bk .kb img, .bk .kb video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .bk .kb.wide { left: 0; top: 0; height: 1920px; }


      /* ---------- vector map (official swisstopo outline + lakes), A -> B trail ---------- */
      #chmap { position: absolute; left: 0; top: 0; }
      .pin { position: absolute; width: 0; height: 0; visibility: hidden; }
      .pin i { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; background: #b3121e; border: 5px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      .pin.pe i { left: -9px; top: -9px; width: 18px; height: 18px; border-width: 4px; background: #1b232b; }
      .pin span { position: absolute; top: -24px; font: 800 40px/1 Poppins, sans-serif; color: #1b232b; white-space: nowrap; letter-spacing: -0.01em; }
      .pin.r span { left: 30px; } .pin.l span { right: 28px; top: -18px; font-size: 30px; font-weight: 700; }
      .pin.pb span { color: #b3121e; font-size: 52px; top: -30px; }
      /* ---------- titles ---------- */
      .hero, .place { position: absolute; left: 0; width: 1080px; text-align: center; pointer-events: none; visibility: hidden; }
      .hero { z-index: 25; top: 605px; }           /* below the presenter: the cap/head overlaps the word */
      .place { z-index: 40; top: 190px; }
      .hero .w { position: relative; display: inline-block; }
      .hero .big { display: block; font: 800 250px/0.9 Poppins, sans-serif; letter-spacing: -0.035em; color: #fff;
        text-shadow: 0 10px 50px rgba(10, 16, 22, 0.42), 0 2px 10px rgba(10, 16, 22, 0.25); white-space: nowrap; }
      .hero .scr { position: absolute; left: 0px; top: -88px; font: 400 128px/1 Sacramento, cursive; color: #fff; transform: rotate(-7deg);
        transform-origin: 0 100%; text-shadow: 0 4px 26px rgba(10, 16, 22, 0.55); white-space: nowrap; }
      .place .kick { display: inline-flex; align-items: center; gap: 16px; font: italic 700 40px/1 Poppins, sans-serif; color: #fff; letter-spacing: 0.01em;
        text-shadow: 0 3px 18px rgba(10, 16, 22, 0.55); margin-bottom: 14px; }
      .place .big { font-family: NSD, serif; font-weight: 800; font-stretch: 62.5%; font-variation-settings: "wdth" 62.5, "wght" 800;
        font-size: 210px; line-height: 0.86; letter-spacing: 0.005em; color: var(--red); text-transform: uppercase;
        text-shadow: 0 6px 34px rgba(10, 16, 22, 0.32), 0 1px 3px rgba(10, 16, 22, 0.25); }
      .place .big .ln { display: block; }
      .flag { width: 40px; height: 40px; border-radius: 7px; background: #da291c; position: relative; flex: none; box-shadow: 0 3px 12px rgba(0,0,0,.35); }
      .flag::before, .flag::after { content: ""; position: absolute; background: #fff; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      .flag::before { width: 25px; height: 7.5px; } .flag::after { width: 7.5px; height: 25px; }
      /* brand act variant */
      /* readable glow: deep-purple stroke + dark halo behind every letter, so it reads on white pages and bright sky */
      .place.ak .kick { color: #fff; -webkit-text-stroke: 7px var(--deep); paint-order: stroke fill; text-shadow: 0 0 18px rgba(29, 0, 80, 0.95), 0 0 40px rgba(29, 0, 80, 0.6); }
      .place.ak .big { color: #fff; -webkit-text-stroke: 10px var(--deep); paint-order: stroke fill; text-shadow: 0 8px 0 var(--deep), 0 0 30px rgba(29, 0, 80, 0.9), 0 0 70px rgba(29, 0, 80, 0.55); }
      .hero.ak .big { -webkit-text-stroke: 12px var(--deep); paint-order: stroke fill; text-shadow: 0 10px 0 var(--deep), 0 0 34px rgba(29, 0, 80, 0.9), 0 0 80px rgba(29, 0, 80, 0.55); }
      .hero.ak .scr { color: #fff; -webkit-text-stroke: 6px var(--deep); paint-order: stroke fill; text-shadow: 0 0 16px rgba(29, 0, 80, 0.95), 0 0 36px rgba(29, 0, 80, 0.6); }
      #url { position: absolute; z-index: 40; left: 0; width: 1080px; top: 300px; text-align: center; font: 700 52px/1 Poppins, sans-serif; color: #fff; letter-spacing: 0.04em;
        -webkit-text-stroke: 8px var(--deep); paint-order: stroke fill; text-shadow: 0 5px 0 var(--deep), 0 0 26px rgba(29, 0, 80, 0.9), 0 0 56px rgba(29, 0, 80, 0.55); visibility: hidden; }
      #url b { color: var(--royal); font-weight: 700; }

      /* ---------- presenter (pixel-exact cut-out) ---------- */
      #pres-wrap { z-index: 30; }
      #pres-cam { position: absolute; inset: 0; }
      #pres { position: absolute; left: 0; top: 76px; width: 1080px; height: 1920px; }  /* pushed down: the script iPad stays out of frame */

      /* ---------- itinerary page, full frame with 3D tilt ---------- */
      #itin { z-index: 45; overflow: hidden; visibility: hidden;
        background: radial-gradient(120% 70% at 30% 20%, #3a1585 0%, var(--ap) 55%, #170040 100%); }
      #itin-tilt { position: absolute; left: 34px; top: 110px; width: 1180px; height: 2391px; transform-origin: 0% 20%; will-change: transform; }
      #itin-scroll { position: absolute; left: 0; top: 0; width: 1180px; height: 2391px; will-change: transform; }
      #itin-scroll img { width: 1180px; height: 2391px; display: block; border-radius: 26px; box-shadow: 0 60px 120px rgba(8, 0, 30, 0.55), 0 0 0 1px rgba(255,255,255,.4); }
      #d3-line { position: absolute; left: 116px; top: 1572px; width: 300px; height: 5px; border-radius: 3px; background: var(--lilac); transform-origin: 0 50%; transform: scaleX(0); }

      /* ---------- captions ---------- */
      #caps { z-index: 50; pointer-events: none; }
      .cap { position: absolute; left: 60px; width: 960px; top: 1500px; text-align: center; visibility: hidden; font: 800 66px/1.08 Poppins, sans-serif; color: #fff; letter-spacing: -0.01em;
        -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 rgba(27, 35, 43, 0.9), 0 12px 30px rgba(0, 0, 0, 0.4); }
      .cap .kw { color: var(--royal); }
      .cap.ak { -webkit-text-stroke: 10px var(--deep); text-shadow: 0 7px 0 var(--deep), 0 0 22px rgba(29, 0, 80, 0.9), 0 0 48px rgba(29, 0, 80, 0.65); }
      .cap.ak .kw { color: var(--royal); }

      #outro-wrap { z-index: 60; visibility: hidden; }
      #outro-wrap video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
